<svg xmlns="http://www.w3.org/2000/svg" width="320" height="84" aria-label="Hick's Law: T equals b times log base 2 of n plus 1" role="img" viewBox="0 0 320 84"><title>Hick&apos;s Law: T equals b times log base 2 of n plus 1</title><rect width="320" height="84" x="0" y="0" fill="#fff"/><text x="160" y="54" fill="#212529" font-family="Georgia, Times New Roman, serif" font-size="30" text-anchor="middle" xml:space="preserve"><tspan font-style="italic">T</tspan><tspan> = </tspan><tspan font-style="italic">b</tspan><tspan> · log</tspan><tspan dy="7" font-size="18">2</tspan><tspan dy="-7">(</tspan><tspan font-style="italic">n</tspan><tspan> + 1)</tspan></text></svg>